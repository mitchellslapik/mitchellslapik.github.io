
name: Deploy site

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll website
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --trace

      - name: Diagnose homepage
        run: |
          echo "=== Generated homepage ==="
          ls -lah _site/index.html || true

          echo ""
          echo "=== Generated HTML files ==="
          find _site -name "*.html" | head -40

          echo ""
          echo "=== Search for biography ==="
          grep -rl "MD/PhD candidate" _site --include="*.html" || true

          echo ""
          echo "=== Check About source ==="
          ls -lah _pages/about.md
          head -25 _pages/about.md

          echo ""
          echo "=== Check for conflicting index files ==="
          find . -maxdepth 2 \
            \( -name "index.md" -o -name "index.html" \) \
            -not -path "./_site/*" -print

          echo ""
          echo "=== Inspect generated homepage ==="
          if [ -f _site/index.html ]; then
            head -c 3000 _site/index.html
          else
            echo "ERROR: _site/index.html does not exist"
          fi

          echo ""
          echo "=== Check Jekyll configuration ==="
          grep -n "include:" _config.yml || true
          grep -n "_pages" _config.yml || true

      - name: Verify homepage
        run: |
          if [ ! -s _site/index.html ]; then
            echo "::error::Jekyll did not generate a nonempty homepage."
            exit 1
          fi

          if ! grep -q "MD/PhD candidate" _site/index.html; then
            echo "::error::Homepage exists but biography is missing."
            exit 1
          fi

          echo "Homepage verified successfully."

      - name: Prevent additional Jekyll processing
        run: touch _site/.nojekyll

      - name: Deploy website
        if: false
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
