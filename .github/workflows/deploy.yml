
name: Deploy site

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --trace

      - name: Verify homepage
        run: |
          test -s _site/index.html

          if ! grep -q "I am an MD/PhD candidate" _site/index.html; then
            echo "::error::Homepage biography is missing."
            exit 1
          fi

          if ! grep -q "In psychiatry" _site/index.html; then
            echo "::error::Psychiatry paragraph is missing."
            exit 1
          fi

          echo "Homepage content verified."

      - name: Prevent second Jekyll build
        run: touch _site/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
