
name: Deploy site

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install dependencies
        run: |
          bundle install

      - name: Build website
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --trace

      - name: Verify generated homepage
        run: |
          if [ ! -s _site/index.html ]; then
            echo "::error::Homepage is missing or empty."
            echo "Generated HTML files:"
            find _site -name "*.html" | head -40
            exit 1
          fi

          if ! grep -q "MD/PhD candidate" _site/index.html; then
            echo "::error::Homepage biography is missing."
            exit 1
          fi

          echo "Homepage verified successfully."

      - name: Prevent second Jekyll build
        run: |
          touch _site/.nojekyll
          test -f _site/.nojekyll

      - name: Deploy website
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
